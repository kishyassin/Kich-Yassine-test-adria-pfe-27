spring.application.name=ebank-chatbot
server.port=8083

# Configuration Import & Config Server
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:configserver:http://localhost:9999

# Eureka Discovery
spring.cloud.discovery.enabled=true
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Spring AI OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Spring AI MCP Client - Connectors to Microservices
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8082/mcp
spring.ai.mcp.client.streamable-http.connections.transaction.url=http://localhost:8084/mcp

# Discord Bot Token (optional)
discord.token=${DISCORD_BOT_TOKEN:+}

# Actuator Endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Swagger UI & OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
